name: Fetch Google Sheet Data

on:
  schedule:
    - cron: '0 */4 * * *'    # Runs at 0 minutes past the hour, every 4 hours
  workflow_dispatch:      # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch sheet data
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          FALLBACK='{"table":{"cols":[],"rows":[]}}'

          fetch_tab () {
            local tab_name="$1"
            local out_file="$2"
            local encoded
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$tab_name")
            local url="https://docs.google.com/spreadsheets/d/$SHEET_ID/gviz/tq?tqx=out:json&sheet=$encoded"

            echo "Fetching '$tab_name' -> $out_file"
            echo "URL: $url"
            if curl -fsL "$url" -o /tmp/raw.json; then
              echo "Raw response (first 500 chars):"
              head -c 500 /tmp/raw.json
              echo ""
              echo "---"
              # Strip the google.visualization.Query.setResponse(...) wrapper
              sed 's/^[^{]*//;s/[^}]*$//' /tmp/raw.json > "$out_file"
              echo "After sed (first 200 chars):"
              head -c 200 "$out_file"
              echo ""
              if [ ! -s "$out_file" ] || ! jq empty "$out_file" >/dev/null 2>&1; then
                echo "  WARNING: response for '$tab_name' wasn't valid JSON after stripping — using fallback"
                echo "$FALLBACK" > "$out_file"
              else
                echo "  OK ($(wc -c < "$out_file") bytes)"
              fi
            else
              echo "  ERROR: curl failed for '$tab_name' (HTTP error)"
              echo "$FALLBACK" > "$out_file"
            fi
          }

          fetch_tab "Savings Dashboard" "data/savings-dashboard.json"
          fetch_tab "DCA Log"           "data/dca-log.json"
          fetch_tab "DCA Rules"         "data/dca-rules.json"

          echo "---- final data/ contents ----"
          ls -lah data/

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update sheet data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes to commit"
          fi
